<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="30">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#113562">
<title>SynerLink se está actualizando</title>
<!--
  Página de mantenimiento de SynerLink. La sirve IIS directamente (sin pasar por
  Node) cuando:
    - existe la bandera de mantenimiento (503 planificado), o
    - Node no responde y ARR devuelve 502/503.
  Debe ser AUTOCONTENIDA: sin fuentes, scripts, imágenes ni hojas externas,
  porque durante el mantenimiento todo lo demás va a la app, que está abajo.
  Todo (estilos, ícono, animaciones y el contador) va en este archivo.
  Mismo lenguaje visual que la landing (components/landing): azul #113562 y celeste #3db6e0.
  Fuente en el repo: deploy/iis/_mantenimiento/index.html
-->
<style>
  :root {
    --navy: #113562;
    --navy-deep: #0b2442;
    --sky: #3db6e0;
    --bg: #f5f7fb;
    --ink: #111827;
    --ink-2: #4b5563;
    --ink-3: #6b7280;
    --line: rgba(17, 53, 98, 0.08);
    --card: rgba(255, 255, 255, 0.86);
    --card-border: rgba(255, 255, 255, 0.9);
    --track: rgba(17, 53, 98, 0.08);
    --spring: cubic-bezier(0.22, 1, 0.36, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1424;
      --ink: #eef2f8;
      --ink-2: #c3ccda;
      --ink-3: #8e9ab0;
      --line: rgba(255, 255, 255, 0.08);
      --card: rgba(18, 31, 54, 0.86);
      --card-border: rgba(255, 255, 255, 0.08);
      --track: rgba(255, 255, 255, 0.1);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    overflow-x: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  /* Fondo: manchas de color que flotan y una retícula de puntos */
  .fondo { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .mancha { position: absolute; border-radius: 50%; will-change: transform; }
  .m1 { width: 620px; height: 620px; top: -220px; left: -180px;
        background: radial-gradient(closest-side, rgba(61, 182, 224, 0.55), rgba(61, 182, 224, 0.18) 55%, transparent);
        animation: flotar 18s ease-in-out infinite alternate; }
  .m2 { width: 680px; height: 680px; bottom: -260px; right: -220px;
        background: radial-gradient(closest-side, rgba(17, 53, 98, 0.35), rgba(17, 53, 98, 0.1) 55%, transparent);
        animation: flotar 22s ease-in-out -7s infinite alternate-reverse; }
  .m3 { width: 420px; height: 420px; top: 55%; left: 60%;
        background: radial-gradient(closest-side, rgba(61, 182, 224, 0.3), transparent);
        animation: flotar 26s ease-in-out -12s infinite alternate; }
  .puntos {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(17, 53, 98, 0.14) 1px, transparent 0);
    background-size: 22px 22px;
    -webkit-mask-image: radial-gradient(ellipse 60% 55% at 50% 50%, #000 15%, transparent 75%);
    mask-image: radial-gradient(ellipse 60% 55% at 50% 50%, #000 15%, transparent 75%);
  }
  @media (prefers-color-scheme: dark) {
    .puntos { background-image: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.1) 1px, transparent 0); }
    .m2 { background: radial-gradient(closest-side, rgba(61, 182, 224, 0.18), transparent); }
  }
  @keyframes flotar {
    0% { transform: translate3d(0, 0, 0) scale(1); }
    50% { transform: translate3d(50px, 30px, 0) scale(1.06); }
    100% { transform: translate3d(-30px, 60px, 0) scale(0.96); }
  }

  /* Tarjeta tipo ventana de macOS */
  main {
    width: 100%;
    max-width: 480px;
    border-radius: 28px;
    background: var(--card);
    border: 1px solid var(--card-border);
    box-shadow: 0 50px 100px -40px rgba(17, 53, 98, 0.5), 0 18px 40px -24px rgba(17, 53, 98, 0.3);
    -webkit-backdrop-filter: saturate(170%) blur(24px);
    backdrop-filter: saturate(170%) blur(24px);
    overflow: hidden;
    animation: entrar 0.9s var(--spring) both;
  }
  @keyframes entrar { from { opacity: 0; transform: translateY(24px) scale(0.97); } }
  .barra { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .luz { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.15); }
  .luz.r { background: #ff5f57; } .luz.a { background: #febc2e; } .luz.v { background: #28c840; }
  .barra span:last-child { flex: 1; margin-right: 52px; text-align: center; font-size: 13px; font-weight: 600; color: var(--ink-3); }

  .contenido { padding: 34px 30px 26px; text-align: center; }

  /* Carga: núcleo SL con ondas y cuatro áreas orbitando */
  .carga { position: relative; width: 168px; height: 168px; margin: 0 auto 26px; }
  .orbita { position: absolute; inset: 0; border-radius: 50%; border: 1.5px dashed rgba(17, 53, 98, 0.14); animation: girar 14s linear infinite; }
  .orbita.interna { inset: 26px; border-color: rgba(61, 182, 224, 0.25); animation-duration: 9s; animation-direction: reverse; }
  .satelite {
    position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
    background: linear-gradient(140deg, var(--sky), var(--navy));
    box-shadow: 0 0 0 4px rgba(61, 182, 224, 0.15), 0 6px 14px -4px rgba(17, 53, 98, 0.6);
  }
  .orbita .satelite:nth-child(1) { top: 0; left: 50%; }
  .orbita .satelite:nth-child(2) { top: 50%; left: 100%; }
  .orbita .satelite:nth-child(3) { top: 100%; left: 50%; }
  .orbita .satelite:nth-child(4) { top: 50%; left: 0; }
  .orbita.interna .satelite { width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; }
  .nucleo {
    position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px;
    display: grid; place-items: center; border-radius: 23px; color: #fff;
    background: linear-gradient(150deg, #2a8fc6 0%, var(--navy) 70%, var(--navy-deep) 100%);
    box-shadow: 0 18px 36px -14px rgba(17, 53, 98, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    font-size: 26px; font-weight: 800; letter-spacing: -0.06em;
    animation: latir 2.4s var(--spring) infinite;
  }
  .onda {
    position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px;
    border-radius: 23px; border: 1.5px solid rgba(61, 182, 224, 0.6);
    animation: onda 2.4s var(--spring) infinite;
  }
  .onda.d2 { animation-delay: 0.8s; } .onda.d3 { animation-delay: 1.6s; }
  @keyframes girar { to { transform: rotate(360deg); } }
  @keyframes latir { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  @keyframes onda { from { transform: scale(0.95); opacity: 0.9; } to { transform: scale(2); opacity: 0; } }

  .marca { display: inline-flex; align-items: baseline; margin-bottom: 14px; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; color: var(--ink-3); }
  .marca b { color: var(--navy); }
  .marca i { font-style: normal; color: var(--sky); }
  @media (prefers-color-scheme: dark) { .marca b { color: #9cc7ef; } }

  .estado {
    display: inline-flex; align-items: center; gap: 8px; margin-bottom: 16px; padding: 5px 12px 5px 10px;
    border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--sky); background: rgba(61, 182, 224, 0.1); border: 1px solid rgba(61, 182, 224, 0.25);
  }
  .estado::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--sky); box-shadow: 0 0 0 0 rgba(61, 182, 224, 0.6); animation: punto 2s infinite; }
  @keyframes punto { 70% { box-shadow: 0 0 0 7px rgba(61, 182, 224, 0); } 100% { box-shadow: 0 0 0 0 rgba(61, 182, 224, 0); } }

  h1 { margin: 0 0 10px; font-size: clamp(24px, 6vw, 30px); line-height: 1.15; font-weight: 750; letter-spacing: -0.035em; }
  h1 span {
    background: linear-gradient(100deg, var(--navy) 0%, #1f6fae 45%, var(--sky) 95%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  @media (prefers-color-scheme: dark) { h1 span { background-image: linear-gradient(100deg, #9cc7ef, var(--sky)); } }
  p { margin: 0 0 8px; color: var(--ink-2); }
  .destacado { font-size: 17px; font-weight: 600; color: var(--ink); }

  /* Próximo intento: barra que se llena en 30 s (igual que el refresh) */
  .intento { margin: 22px 0 4px; text-align: left; }
  .intento-info { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-3); margin-bottom: 8px; }
  .intento-info strong { color: var(--ink); font-variant-numeric: tabular-nums; }
  .pista { height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .progreso {
    height: 100%; width: 100%; border-radius: inherit; transform-origin: 0 50%;
    background: linear-gradient(90deg, var(--navy), var(--sky));
    animation: llenar 30s linear both;
  }
  @keyframes llenar { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  button {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 20px; min-height: 48px; padding: 0 26px; border: 0; border-radius: 999px;
    font: inherit; font-size: 16px; font-weight: 600; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, var(--navy) 0%, #1c5a94 55%, var(--sky) 130%);
    box-shadow: 0 10px 26px -10px rgba(17, 53, 98, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    transition: transform 0.35s var(--spring), box-shadow 0.35s var(--spring);
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 16px 32px -12px rgba(17, 53, 98, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.3); }
  button:active { transform: scale(0.96); }
  button:focus-visible { outline: 3px solid rgba(61, 182, 224, 0.6); outline-offset: 3px; }
  button svg { transition: transform 0.5s var(--spring); }
  button:hover svg { transform: rotate(180deg); }

  .pie { padding: 14px 20px 18px; border-top: 1px solid var(--line); text-align: center; font-size: 13px; color: var(--ink-3); }

  @media (max-width: 420px) {
    .contenido { padding: 28px 20px 22px; }
    .carga { width: 144px; height: 144px; }
    .orbita.interna { inset: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .progreso { transform: scaleX(1); }
  }
</style>
</head>
<body>
<div class="fondo" aria-hidden="true">
  <span class="mancha m1"></span>
  <span class="mancha m2"></span>
  <span class="mancha m3"></span>
  <span class="puntos"></span>
</div>

<main>
  <div class="barra" aria-hidden="true">
    <span class="luz r"></span><span class="luz a"></span><span class="luz v"></span>
    <span>SynerLink</span>
  </div>

  <div class="contenido">
    <div class="carga" role="presentation">
      <div class="orbita"><span class="satelite"></span><span class="satelite"></span><span class="satelite"></span><span class="satelite"></span></div>
      <div class="orbita interna"><span class="satelite"></span><span class="satelite"></span></div>
      <span class="onda"></span><span class="onda d2"></span><span class="onda d3"></span>
      <div class="nucleo">SL</div>
    </div>

    <div class="marca" aria-label="SynerLink"><b>Syner</b><i>Link</i></div>
    <br>
    <span class="estado">Actualización en curso</span>

    <h1>SynerLink se está <span>actualizando</span></h1>
    <p class="destacado">Vuelve en unos minutos.</p>
    <p>Estamos instalando una nueva versión. No necesitas hacer nada: esta página se recarga sola cada 30 segundos.</p>

    <div class="intento" aria-hidden="true">
      <div class="intento-info"><span>Próximo intento</span><strong id="segundos">30 s</strong></div>
      <div class="pista"><div class="progreso"></div></div>
    </div>

    <button type="button" onclick="location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-15.5-2m-.5-4v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></svg>
      Intentar de nuevo
    </button>
  </div>

  <div class="pie">Group Shared Services Latinoamérica</div>
</main>

<script>
  // Cuenta regresiva hasta el próximo intento. El meta refresh (30 s) sigue siendo la
  // garantía: esto solo muestra cuántos segundos faltan.
  (function () {
    var el = document.getElementById('segundos');
    if (!el) return;
    var inicio = Date.now();
    var timer = setInterval(function () {
      var faltan = Math.max(0, 30 - Math.floor((Date.now() - inicio) / 1000));
      el.textContent = faltan > 0 ? faltan + ' s' : 'reintentando…';
      if (faltan === 0) clearInterval(timer);
    }, 250);
  })();
</script>
</body>
</html>
