          echo "IF OBJECT_ID(N'dbo.chat_project_repo_catalog', N'U') IS NULL OR OBJECT_ID(N'dbo.chat_project_agent_policy', N'U') IS NULL OR OBJECT_ID(N'dbo.chat_project_agent_policy_repo', N'U') IS NULL OR OBJECT_ID(N'dbo.chat_project_agent_policy_log', N'U') IS NULL OR OBJECT_ID(N'dbo.TR_chat_project_agent_policy_log_inmutable', N'TR') IS NULL OR (SELECT COUNT(*) FROM sys.check_constraints WHERE name IN (N'chat_project_repo_catalog_valores_ck', N'chat_project_agent_policy_valores_ck', N'chat_project_agent_policy_log_valores_ck')) <> 3 OR (SELECT COUNT(*) FROM dbo.chat_project_repo_catalog) <> 2 OR (SELECT COUNT(*) FROM dbo.chat_project_agent_policy) <> 0 OR NOT EXISTS (SELECT 1 FROM dbo.subprocess WHERE subprocess_url = N'/process/proyectos/permisos-agentes') OR EXISTS (SELECT 1 FROM dbo.subprocess_user_company suc INNER JOIN dbo.subprocess s ON s.id_subprocess = suc.id_subprocess WHERE s.subprocess_url = N'/process/proyectos/permisos-agentes') THROW 50000, N'La migración de permisos de los agentes no dejó lo esperado (tablas, CHECK, trigger, catálogo inicial, subproceso apagado y ninguna política).', 1;" > /tmp/permisos-ok.sql
          npx prisma db execute --schema prisma/schema.prisma --file /tmp/permisos-ok.sql
          # Datos de prueba: una política «lectura» con su repo y su registro (la reversa debe negarse a perderlos).
          echo "DECLARE @p INT = (SELECT TOP 1 id_project FROM dbo.chat_project ORDER BY id_project); IF @p IS NULL THROW 50000, N'No hay proyecto de prueba.', 1; INSERT INTO dbo.chat_project_agent_policy (id_project, code_level, reason) VALUES (@p, N'lectura', N'CI'); INSERT INTO dbo.chat_project_agent_policy_repo (id_project, id_repo) SELECT @p, id_repo FROM dbo.chat_project_repo_catalog WHERE slug = N'sapsend'; INSERT INTO dbo.chat_project_agent_policy_log (scope, id_project, action, after_value, reason) VALUES (N'proyecto', @p, N'crear', N'{}', N'CI');" > /tmp/permisos-datos.sql
          npx prisma db execute --schema prisma/schema.prisma --file /tmp/permisos-datos.sql
          echo "UPDATE dbo.chat_project_agent_policy SET deploy_approvers = N'nicolas.rivera@gsslatam.com';" > /tmp/permisos-check.sql
          if npx prisma db execute --schema prisma/schema.prisma --file /tmp/permisos-check.sql; then echo "El CHECK debió negar autorizadores de pases en nivel lectura"; exit 1; fi
          echo "UPDATE dbo.chat_project_agent_policy SET code_level = N'desarrollo_pases';" > /tmp/permisos-pases.sql
          if npx prisma db execute --schema prisma/schema.prisma --file /tmp/permisos-pases.sql; then echo "El CHECK debió negar pases sin autorizadores"; exit 1; fi
          echo "UPDATE dbo.chat_project_agent_policy SET code_level = N'root';" > /tmp/permisos-nivel.sql
          if npx prisma db execute --schema prisma/schema.prisma --file /tmp/permisos-nivel.sql; then echo "El CHECK debió negar un nivel desconocido"; exit 1; fi
          echo "UPDATE dbo.chat_project_agent_policy_log SET reason = N'alterado';" > /tmp/permisos-alterar.sql
          if npx prisma db execute --schema prisma/schema.prisma --file /tmp/permisos-alterar.sql; then echo "El registro de permisos debió negarse a cambiar"; exit 1; fi
          echo "DELETE FROM dbo.chat_project_agent_policy_log;" > /tmp/permisos-borrar.sql
          if npx prisma db execute --schema prisma/schema.prisma --file /tmp/permisos-borrar.sql; then echo "El registro de permisos debió negarse a borrar"; exit 1; fi
          echo "INSERT INTO dbo.chat_project_repo_catalog (slug, name, github, branch_testing, branch_production) VALUES (N'sapsend', N'x', N'a/b', N't', N'p');" > /tmp/permisos-dup.sql
          if npx prisma db execute --schema prisma/schema.prisma --file /tmp/permisos-dup.sql; then echo "La clave repetida del catálogo debió fallar"; exit 1; fi
          if npx prisma db execute --schema prisma/schema.prisma --file prisma/manual/2026-10-20-proyectos-permisos-agentes-PROD.sql; then echo "El script de PROD de permisos de los agentes debió negarse en kronos_ci"; exit 1; fi
          # «Mis stickers» del chat (2026-10-21): migración y PRUEBAS dos veces (idempotencia), tabla, índices y CHECK, y PROD que se niega.
          npx prisma db execute --schema prisma/schema.prisma --file prisma/migrations/20261021120000_chat_stickers_personales/migration.sql
          npx prisma db execute --schema prisma/schema.prisma --file prisma/migrations/20261021120000_chat_stickers_personales/migration.sql
          npx prisma db execute --schema prisma/schema.prisma --file prisma/manual/2026-10-21-chat-stickers-personales-PRUEBAS.sql
          npx prisma db execute --schema prisma/schema.prisma --file prisma/manual/2026-10-21-chat-stickers-personales-PRUEBAS.sql
          echo "IF OBJECT_ID(N'dbo.chat_sticker_personal', N'U') IS NULL OR NOT EXISTS (SELECT 1 FROM sys.indexes WHERE name = N'chat_sticker_personal_user_idx') OR NOT EXISTS (SELECT 1 FROM sys.indexes WHERE name = N'chat_sticker_personal_propuesta_idx') OR (SELECT COUNT(*) FROM sys.check_constraints WHERE name IN (N'chat_sticker_personal_estado_ck', N'chat_sticker_personal_aprobado_ck')) <> 2 THROW 50000, N'La migración de Mis stickers no dejó la tabla, los índices o los CHECK.', 1;" > /tmp/mis-stickers-ok.sql
          npx prisma db execute --schema prisma/schema.prisma --file /tmp/mis-stickers-ok.sql
          if npx prisma db execute --schema prisma/schema.prisma --file prisma/manual/2026-10-21-chat-stickers-personales-PROD.sql; then echo "El script de PROD de Mis stickers debió negarse en kronos_ci"; exit 1; fi
          # Medidor del consumo de Anthropic (2026-10-22): migración y PRUEBAS dos veces (idempotencia), tabla y CHECK, y PROD que se niega.
          npx prisma db execute --schema prisma/schema.prisma --file prisma/migrations/20261022120000_chat_agent_quota/migration.sql
          npx prisma db execute --schema prisma/schema.prisma --file prisma/migrations/20261022120000_chat_agent_quota/migration.sql
          npx prisma db execute --schema prisma/schema.prisma --file prisma/manual/2026-10-22-chat-agent-quota-PRUEBAS.sql
          npx prisma db execute --schema prisma/schema.prisma --file prisma/manual/2026-10-22-chat-agent-quota-PRUEBAS.sql
          echo "IF OBJECT_ID(N'dbo.chat_agent_quota', N'U') IS NULL OR (SELECT COUNT(*) FROM sys.check_constraints WHERE name IN (N'chat_agent_quota_fuente_ck', N'chat_agent_quota_rango_ck')) <> 2 THROW 50000, N'La migración del medidor de consumo no dejó la tabla o los CHECK.', 1;" > /tmp/cuota-ok.sql
          npx prisma db execute --schema prisma/schema.prisma --file /tmp/cuota-ok.sql
          if npx prisma db execute --schema prisma/schema.prisma --file prisma/manual/2026-10-22-chat-agent-quota-PROD.sql; then echo "El script de PROD del medidor de consumo debió negarse en kronos_ci"; exit 1; fi
          # Bitácora · actividades de texto libre (2026-10-17): migración y PRUEBAS dos veces, reversa y otra vez PRUEBAS (idempotencia ida y vuelta).
          npx prisma db execute --schema prisma/schema.prisma --file prisma/migrations/20261017200000_bitacora_proceso_texto_libre/migration.sql
          npx prisma db execute --schema prisma/schema.prisma --file prisma/migrations/20261017200000_bitacora_proceso_texto_libre/migration.sql
          npx prisma db execute --schema prisma/schema.prisma --file prisma/manual/2026-10-17-bitacora-proceso-texto-libre-PRUEBAS.sql
          npx prisma db execute --schema prisma/schema.prisma --file prisma/manual/2026-10-17-bitacora-proceso-texto-libre-PRUEBAS.sql
          npx prisma db execute --schema prisma/schema.prisma --file prisma/manual/2026-10-17-bitacora-proceso-texto-libre-reversa.sql
          npx prisma db execute --schema prisma/schema.prisma --file prisma/manual/2026-10-17-bitacora-proceso-texto-libre-reversa.sql
          npx prisma db execute --schema prisma/schema.prisma --file prisma/manual/2026-10-17-bitacora-proceso-texto-libre-PRUEBAS.sql
          echo "IF COL_LENGTH(N'dbo.ot_actividad', N'texto_libre') IS NULL OR COL_LENGTH(N'dbo.ot_registro', N'es_texto_libre') IS NULL THROW 50000, N'Faltan las columnas de texto libre de la bitácora.', 1;" > /tmp/texto-libre-ok.sql
          npx prisma db execute --schema prisma/schema.prisma --file /tmp/texto-libre-ok.sql
          if npx prisma db execute --schema prisma/schema.prisma --file prisma/manual/2026-10-17-bitacora-proceso-texto-libre-PROD.sql; then echo "El script de PROD de texto libre debió negarse en kronos_ci"; exit 1; fi

      - name: Pruebas de integración + cobertura de lib/sgc/db (vitest)
        run: npm run test:integration -- --coverage --reporter=default --reporter=junit --outputFile.junit=reports/integracion/junit.xml

      - name: Integración del MCP (correo_* de «Consultar a un agente», SQL real)
        # El SQL crudo de kronos-mcp (concesión, propuestas, auditoría) contra la MISMA base efímera.
        run: |
          cd mcp && (npm ci || npm install)
          npx vitest run --config vitest.integration.config.ts --reporter=default

      - name: Reversas del SGC (ida y vuelta, S8 en adelante)
        # Cada reversa nueva se prueba contra la base efímera DESPUÉS de las
        # pruebas (con datos reales de prueba): se corre dos veces (idempotente)
        # declarando en la sesión que se aceptan sus pérdidas, y luego se vuelve
        # a aplicar la migración (que también debe quedar igual). Las reversas
        # se corren de la más nueva a la más antigua.
        env:
          DATABASE_URL: ${{ env.SGC_IT_DATABASE_URL }}
        run: |
          set -e
          # Banderas de sesión con las que cada reversa acepta sus pérdidas (datos de prueba).
          FLAGS="sgc_reversa_pendientes_archivo sgc_reversa_padres sgc_reversa_propuestas sgc_reversa_recapacitaciones sgc_reversa_flujo_s10 sgc_reversa_copias sgc_reversa_sustitutos sgc_reversa_firma_propia sgc_reversa_modelo_roles sgc_reversa_lideres_departamento sgc_reversa_encabezados sgc_reversa_evaluaciones sgc_reversa_generador sgc_reversa_generador_guia sgc_reversa_padres_hijos chat_proyectos_reversa_acepta_perdida proyectos_modulo_reversa_acepta_perdida proyectos_cronograma_reversa_acepta_perdida proyectos_equipo_reversa_acepta_perdida proyectos_no_leidos_reversa_acepta_perdida chat_reacciones_reversa_acepta_perdida proyectos_permisos_agentes_reversa_acepta_perdida proyectos_config_agentes_reversa_acepta_perdida chat_stickers_personales_reversa_acepta_perdida"
          reversa() {
            { for f in $FLAGS; do printf "EXEC sp_set_session_context N'%s', 1;\n" "$f"; done; cat "$1"; } > /tmp/reversa.sql
            npx prisma db execute --schema prisma/schema.prisma --file /tmp/reversa.sql
            npx prisma db execute --schema prisma/schema.prisma --file /tmp/reversa.sql
          }
          migra() {
            npx prisma db execute --schema prisma/schema.prisma --file "prisma/migrations/$1/migration.sql"
            npx prisma db execute --schema prisma/schema.prisma --file "prisma/migrations/$1/migration.sql"
          }
          # De la más nueva a la más antigua…
          # Medidor del consumo de Anthropic (2026-10-22): ida y vuelta (reversa dos veces, comprobación y la migración otra vez).
          reversa prisma/manual/2026-10-22-chat-agent-quota-reversa.sql
          echo "IF OBJECT_ID(N'dbo.chat_agent_quota', N'U') IS NOT NULL THROW 50000, N'La reversa del medidor de consumo no quitó su tabla.', 1;" > /tmp/cuota-quitado.sql
          npx prisma db execute --schema prisma/schema.prisma --file /tmp/cuota-quitado.sql
          migra 20261022120000_chat_agent_quota
          # Permisos de los agentes de Proyectos (2026-10-20): con la política de prueba, sin la bandera debe negarse; luego ida y vuelta.
          # Va PRIMERO: sus tablas apuntan a chat_project (la reversa de la F1 no podría borrarla). Se vuelve a migrar al final, con la F1.
          if npx prisma db execute --schema prisma/schema.prisma --file prisma/manual/2026-10-20-proyectos-permisos-agentes-reversa.sql; then echo "La reversa de permisos de los agentes debió negarse sin su bandera"; exit 1; fi
          reversa prisma/manual/2026-10-20-proyectos-permisos-agentes-reversa.sql
          echo "IF OBJECT_ID(N'dbo.chat_project_agent_policy', N'U') IS NOT NULL OR OBJECT_ID(N'dbo.chat_project_agent_policy_repo', N'U') IS NOT NULL OR OBJECT_ID(N'dbo.chat_project_agent_policy_log', N'U') IS NOT NULL OR OBJECT_ID(N'dbo.chat_project_repo_catalog', N'U') IS NOT NULL OR EXISTS (SELECT 1 FROM dbo.subprocess WHERE subprocess_url = N'/process/proyectos/permisos-agentes') THROW 50000, N'La reversa de permisos de los agentes no quitó lo suyo.', 1;" > /tmp/permisos-quitado.sql
          npx prisma db execute --schema prisma/schema.prisma --file /tmp/permisos-quitado.sql
          # Configuración de Proyectos por empresa (2026-10-20): con la fila de prueba, sin la bandera debe negarse; luego ida y vuelta (reversa dos veces, comprobación y la migración otra vez).
          if npx prisma db execute --schema prisma/schema.prisma --file prisma/manual/2026-10-20-proyectos-config-agentes-reversa.sql; then echo "La reversa de la configuración de Proyectos debió negarse sin su bandera"; exit 1; fi
          reversa prisma/manual/2026-10-20-proyectos-config-agentes-reversa.sql
          echo "IF OBJECT_ID(N'dbo.chat_project_agent_config', N'U') IS NOT NULL OR OBJECT_ID(N'dbo.chat_project_agent_config_log', N'U') IS NOT NULL OR EXISTS (SELECT 1 FROM dbo.subprocess WHERE subprocess_url = N'/process/proyectos/configuracion') THROW 50000, N'La reversa de la configuración de Proyectos no quitó lo suyo.', 1;" > /tmp/config-proyectos-quitado.sql
          npx prisma db execute --schema prisma/schema.prisma --file /tmp/config-proyectos-quitado.sql
          migra 20261020180000_proyectos_config_agentes
          # «Mis stickers» (2026-10-21): ida y vuelta; va ANTES que la de reacciones (chat_sticker_personal apunta a chat_sticker).
          reversa prisma/manual/2026-10-21-chat-stickers-personales-reversa.sql
          echo "IF OBJECT_ID(N'dbo.chat_sticker_personal', N'U') IS NOT NULL THROW 50000, N'La reversa de Mis stickers no quitó su tabla.', 1;" > /tmp/mis-stickers-quitado.sql
          npx prisma db execute --schema prisma/schema.prisma --file /tmp/mis-stickers-quitado.sql
          # Reacciones, GIF y stickers del chat (2026-10-20): ida y vuelta (reversa dos veces, comprobación y la migración otra vez).
          reversa prisma/manual/2026-10-20-chat-reacciones-stickers-reversa.sql
          echo "IF OBJECT_ID(N'dbo.chat_message_reaction', N'U') IS NOT NULL OR OBJECT_ID(N'dbo.chat_message_media', N'U') IS NOT NULL OR OBJECT_ID(N'dbo.chat_sticker', N'U') IS NOT NULL THROW 50000, N'La reversa de reacciones no quitó sus tablas.', 1;" > /tmp/reacciones-quitado.sql
          npx prisma db execute --schema prisma/schema.prisma --file /tmp/reacciones-quitado.sql
          migra 20261020120000_chat_reacciones_stickers
          migra 20261021120000_chat_stickers_personales
          # No leídos de Proyectos (2026-10-19): con las marcas que dejó la integración, sin la bandera debe negarse; luego ida y vuelta. Va ANTES que la del equipo.
          if npx prisma db execute --schema prisma/schema.prisma --file prisma/manual/2026-10-19-proyectos-no-leidos-reversa.sql; then echo "La reversa de no leídos debió negarse sin su bandera"; exit 1; fi
          reversa prisma/manual/2026-10-19-proyectos-no-leidos-reversa.sql
          echo "IF OBJECT_ID(N'dbo.chat_project_read', N'U') IS NOT NULL THROW 50000, N'La reversa de no leídos no quitó chat_project_read.', 1;" > /tmp/no-leidos-quitado.sql
          npx prisma db execute --schema prisma/schema.prisma --file /tmp/no-leidos-quitado.sql
          # Equipo de subagentes (F2, 2026-10-18): con las filas de prueba, sin la bandera debe negarse; luego ida y vuelta. Va ANTES que la del cronograma.
          if npx prisma db execute --schema prisma/schema.prisma --file prisma/manual/2026-10-18-proyectos-equipo-reversa.sql; then echo "La reversa del equipo debió negarse sin su bandera"; exit 1; fi
          reversa prisma/manual/2026-10-18-proyectos-equipo-reversa.sql
          echo "IF OBJECT_ID(N'dbo.chat_project_subagent', N'U') IS NOT NULL OR OBJECT_ID(N'dbo.chat_project_team_request', N'U') IS NOT NULL OR OBJECT_ID(N'dbo.chat_project_subagent_run', N'U') IS NOT NULL OR OBJECT_ID(N'dbo.chat_project_team_event', N'U') IS NOT NULL OR COL_LENGTH(N'dbo.chat_project', N'team_enabled') IS NOT NULL OR COL_LENGTH(N'dbo.chat_project', N'team_max_parallel') IS NOT NULL THROW 50000, N'La reversa del equipo no quitó lo suyo.', 1;" > /tmp/equipo-quitado.sql
          npx prisma db execute --schema prisma/schema.prisma --file /tmp/equipo-quitado.sql
          # Cronograma de Proyectos (2026-10-18): con la auditoría de prueba, sin la bandera debe negarse; luego ida y vuelta. Va ANTES que la del módulo.
          if npx prisma db execute --schema prisma/schema.prisma --file prisma/manual/2026-10-18-proyectos-cronograma-reversa.sql; then echo "La reversa del cronograma debió negarse sin su bandera"; exit 1; fi
          reversa prisma/manual/2026-10-18-proyectos-cronograma-reversa.sql
          echo "IF OBJECT_ID(N'dbo.chat_project_task', N'U') IS NOT NULL OR OBJECT_ID(N'dbo.chat_project_event', N'U') IS NOT NULL OR OBJECT_ID(N'dbo.chat_project_proposal', N'U') IS NOT NULL OR OBJECT_ID(N'dbo.chat_project_grant', N'U') IS NOT NULL OR COL_LENGTH(N'dbo.chat_project_request', N'target_date') IS NOT NULL THROW 50000, N'La reversa del cronograma no quitó lo suyo.', 1;" > /tmp/cronograma-quitado.sql
          npx prisma db execute --schema prisma/schema.prisma --file /tmp/cronograma-quitado.sql
          # Módulo «Proyectos» (2026-10-18): ida y vuelta; va ANTES que la de la F1 (sus tablas apuntan a chat_project).
          reversa prisma/manual/2026-10-18-proyectos-modulo-reversa.sql
          echo "IF OBJECT_ID(N'dbo.chat_project_agent', N'U') IS NOT NULL OR OBJECT_ID(N'dbo.chat_project_email', N'U') IS NOT NULL OR OBJECT_ID(N'dbo.chat_project_request', N'U') IS NOT NULL OR COL_LENGTH(N'dbo.chat_project', N'description') IS NOT NULL OR EXISTS (SELECT 1 FROM dbo.subprocess WHERE subprocess_url = N'/process/proyectos') OR EXISTS (SELECT 1 FROM dbo.chat_project_member WHERE role NOT IN (N'owner', N'member')) THROW 50000, N'La reversa del módulo Proyectos no quitó lo suyo.', 1;" > /tmp/modulo-proyectos-quitado.sql
          npx prisma db execute --schema prisma/schema.prisma --file /tmp/modulo-proyectos-quitado.sql
          # Proyectos del chat (2026-10-17): ida y vuelta (la reversa y luego la migración otra vez).
          reversa prisma/manual/2026-10-17-chat-proyectos-reversa.sql
          echo "IF OBJECT_ID(N'dbo.chat_project', N'U') IS NOT NULL OR COL_LENGTH(N'dbo.chat_conversation', N'id_project') IS NOT NULL THROW 50000, N'La reversa de proyectos no quitó lo suyo.', 1;" > /tmp/proyectos-quitado.sql
          npx prisma db execute --schema prisma/schema.prisma --file /tmp/proyectos-quitado.sql
          migra 20261017120000_chat_projects
          migra 20261018120000_proyectos_modulo
          migra 20261018180000_proyectos_cronograma
          migra 20261018220000_proyectos_equipo_subagentes
          migra 20261019140000_proyectos_no_leidos
          migra 20261020190000_proyectos_permisos_agentes
          # Padres e hijos (2026-10-19): con tipos padre marcados y relaciones creadas solas (integración), sin la bandera debe negarse.
          if npx prisma db execute --schema prisma/schema.prisma --file prisma/manual/2026-10-19-sgc-padres-hijos-reversa.sql; then echo "La reversa de padres e hijos debió negarse sin su bandera"; exit 1; fi
          reversa prisma/manual/2026-10-19-sgc-padres-hijos-reversa.sql
          echo "IF COL_LENGTH(N'sgc.document_type', N'is_parent_type') IS NOT NULL OR EXISTS (SELECT 1 FROM sys.check_constraints WHERE name = N'document_relation_origen_estado_ck' AND definition LIKE N'%solicitud%') OR EXISTS (SELECT 1 FROM sgc.document_relation WHERE origin IN (N'solicitud', N'carga')) THROW 50000, N'La reversa de padres e hijos no quitó lo suyo.', 1;" > /tmp/padres-hijos-quitado.sql
          npx prisma db execute --schema prisma/schema.prisma --file /tmp/padres-hijos-quitado.sql
          # S19: con un tipo marcado como plantilla guía (integración del Generador), sin la bandera debe negarse.
          if npx prisma db execute --schema prisma/schema.prisma --file prisma/manual/2026-10-14-sgc-s19-generador-sin-codificacion-reversa.sql; then echo "La reversa del S19 debió negarse sin su bandera"; exit 1; fi
          reversa prisma/manual/2026-10-14-sgc-s19-generador-sin-codificacion-reversa.sql
          echo "IF COL_LENGTH(N'sgc.document_type', N'generator_guide') IS NOT NULL THROW 50000, N'La reversa del S19 no quitó la columna.', 1;" > /tmp/s19-quitado.sql
          npx prisma db execute --schema prisma/schema.prisma --file /tmp/s19-quitado.sql
          # S17: con intentos de la integración, sin la bandera debe negarse.
          if npx prisma db execute --schema prisma/schema.prisma --file prisma/manual/2026-10-14-sgc-s17-evaluaciones-reversa.sql; then echo "La reversa del S17 debió negarse sin su bandera"; exit 1; fi
          reversa prisma/manual/2026-10-14-sgc-s17-evaluaciones-reversa.sql
          echo "IF OBJECT_ID(N'[sgc].[training_attempt]', N'U') IS NOT NULL OR EXISTS (SELECT 1 FROM [sgc].[training] WHERE [evaluation_provider] = N'synerlink') THROW 50000, N'La reversa del S17 no quitó lo suyo.', 1;" > /tmp/s17-quitado.sql
          npx prisma db execute --schema prisma/schema.prisma --file /tmp/s17-quitado.sql
          # S16: datos de su empresa de integración (117) y luego el esquema (sin la bandera debe negarse).
          sed 's/DECLARE @IdCompany INT = 3;/DECLARE @IdCompany INT = 117;/' prisma/manual/2026-10-14-sgc-s16-encabezados-excel-olp-reversa.sql > /tmp/reversa-s16-datos.sql
          reversa /tmp/reversa-s16-datos.sql
          if npx prisma db execute --schema prisma/schema.prisma --file prisma/manual/2026-10-14-sgc-s16-encabezados-excel-reversa.sql; then echo "La reversa del S16 debió negarse sin su bandera"; exit 1; fi
          reversa prisma/manual/2026-10-14-sgc-s16-encabezados-excel-reversa.sql
          echo "IF OBJECT_ID(N'[sgc].[header_template]', N'U') IS NOT NULL OR COL_LENGTH(N'sgc.document_type', N'draft_extensions') IS NOT NULL OR COL_LENGTH(N'sgc.document_version', N'source_sha256') IS NULL THROW 50000, N'La reversa del S16 no quitó lo suyo o quitó la huella de los originales.', 1;" > /tmp/s16-quitado.sql
          npx prisma db execute --schema prisma/schema.prisma --file /tmp/s16-quitado.sql
          # S15: primero los datos (el DOC v7 de la empresa de su integración, 116) y luego el esquema.
          # Sin las banderas, la reversa del esquema debe NEGARSE (hay solicitudes v7 abiertas y líderes por departamento).
          sed 's/DECLARE @IdCompany INT = 3;/DECLARE @IdCompany INT = 116;/' prisma/manual/2026-10-14-sgc-s15-flujo-doc-v7-reversa.sql > /tmp/reversa-s15-datos.sql
          reversa /tmp/reversa-s15-datos.sql
          if npx prisma db execute --schema prisma/schema.prisma --file prisma/manual/2026-10-14-sgc-s15-modelo-roles-reversa.sql; then echo "La reversa del S15 debió negarse sin sus banderas"; exit 1; fi
          reversa prisma/manual/2026-10-14-sgc-s15-modelo-roles-reversa.sql
          echo "IF COL_LENGTH(N'sgc.flow_version', N'role_model') IS NOT NULL OR COL_LENGTH(N'sgc.approver_authorization', N'id_department') IS NOT NULL THROW 50000, N'La reversa del S15 no quitó las columnas.', 1;" > /tmp/s15-quitado.sql
          npx prisma db execute --schema prisma/schema.prisma --file /tmp/s15-quitado.sql
          # Generador (PR #587): antes que la del S13.
          reversa prisma/manual/2026-10-10-sgc-generador-plantillas-reversa.sql
          reversa prisma/manual/2026-10-08-sgc-s13-firma-propia-reversa.sql
          reversa prisma/manual/2026-10-08-sgc-s12-aprobadores-sustitutos-reversa.sql
          # Con firmas de sustitutos (integración del S12) la reversa CONSERVA signature.on_behalf_of.
          echo "IF COL_LENGTH(N'sgc.signature', N'on_behalf_of') IS NULL THROW 50000, N'La reversa del S12 quitó signature.on_behalf_of con firmas de sustitutos.', 1;" > /tmp/s12-conserva.sql
          npx prisma db execute --schema prisma/schema.prisma --file /tmp/s12-conserva.sql
          reversa prisma/manual/2026-10-08-sgc-s11-copias-no-controladas-reversa.sql
          # La del S10 también retira el flujo con capacitación previa: se prueba sobre la empresa de su integración (101).
          sed 's/DECLARE @IdCompany INT = 3;/DECLARE @IdCompany INT = 101;/' prisma/manual/2026-10-08-sgc-s10-capacitacion-opcional-reversa.sql > /tmp/reversa-s10.sql
          reversa /tmp/reversa-s10.sql
          reversa prisma/manual/2026-10-08-sgc-s9-archivos-relaciones-correo-reversa.sql
          reversa prisma/manual/2026-10-08-sgc-s8-encabezado-listado-maestro-reversa.sql
          # …y otra vez hacia adelante.
          migra 20261008100000_sgc_s8_encabezado_listado_maestro
          migra 20261008110000_sgc_s9_archivos_relaciones_correo
          migra 20261008120000_sgc_s10_capacitacion_opcional
          migra 20261008130000_sgc_s11_copias_no_controladas
          migra 20261008140000_sgc_s12_aprobadores_sustitutos
          migra 20261008150000_sgc_s13_firma_propia_registro
          migra 20261010100000_sgc_generador_plantillas
          migra 20261014100000_sgc_s15_modelo_roles
          migra 20261014110000_sgc_s16_encabezados_excel
          migra 20261014120000_sgc_s17_evaluaciones
          migra 20261014130000_sgc_s19_generador_sin_codificacion
          migra 20261019100000_sgc_padres_hijos
          npx prisma db execute --schema prisma/schema.prisma --file prisma/manual/2026-10-08-sgc-s8-guia-codificacion-olp.sql

      - name: Bitácora de Proceso — reversa (ida y vuelta)
        # Con las órdenes que dejaron las pruebas de integración: la reversa SIN la
        # bandera de pérdida debe negarse; con la bandera quita todo (dos veces,
        # idempotente) y luego la migración y la siembra vuelven a crearlo.
        env:
          DATABASE_URL: ${{ env.SGC_IT_DATABASE_URL }}
        run: |
          set -e
          M=prisma/migrations/20261013180000_ordenes_trabajo_p0/migration.sql
          M2=prisma/migrations/20261013220000_bitacora_proceso_inspector_iconos/migration.sql
          M3=prisma/migrations/20261013233000_bitacora_proceso_firmas/migration.sql
          S=prisma/manual/2026-10-13-bitacora-proceso-p0-farmalogica.sql
          R=prisma/manual/2026-10-13-bitacora-proceso-p0-reversa.sql
          x() { npx prisma db execute --schema prisma/schema.prisma --file "$1"; }
          # 1) Reversa de los cuatro actores (2026-10-15): con los vistos buenos y PIN de la integración debe negarse
          #    sin su bandera; con ella, dos veces; luego la migración vuelve a aplicarse dos veces.
          M4=prisma/migrations/20261015180000_bitacora_proceso_cuatro_actores/migration.sql
          R4=prisma/manual/2026-10-15-bitacora-proceso-cuatro-actores-reversa.sql
          if x "$R4"; then echo "La reversa de los cuatro actores debió negarse sin su bandera"; exit 1; fi
          { echo "EXEC sp_set_session_context N'ot_cuatro_actores_reversa_acepta_perdida', 1;"; cat "$R4"; } > /tmp/ot-r4.sql
          x /tmp/ot-r4.sql; x /tmp/ot-r4.sql
          cat > /tmp/ot-verifica-r4.sql <<'SQL'
          IF COL_LENGTH(N'dbo.ot_orden_trabajo', N'id_jefe_produccion') IS NOT NULL OR OBJECT_ID(N'dbo.ot_pin', N'U') IS NOT NULL OR COL_LENGTH(N'dbo.ot_firma', N'id_operador') IS NOT NULL
             OR EXISTS (SELECT 1 FROM sys.triggers WHERE name LIKE N'TR[_]ot[_]%' AND is_disabled = 1)
            THROW 50030, N'La reversa de los cuatro actores no quitó lo suyo o dejó un trigger apagado.', 1;
          SQL
          x /tmp/ot-verifica-r4.sql
          x "$M4"; x "$M4"
          # 2) Reversa general del P0.
          if x "$R"; then echo "La reversa debió negarse sin ot_reversa_acepta_perdida"; exit 1; fi
          { echo "EXEC sp_set_session_context N'ot_reversa_acepta_perdida', 1;"; cat "$R"; } > /tmp/ot-reversa.sql
          x /tmp/ot-reversa.sql; x /tmp/ot-reversa.sql
          cat > /tmp/ot-verifica-reversa.sql <<'SQL'
          IF OBJECT_ID(N'dbo.ot_registro', N'U') IS NOT NULL OR OBJECT_ID(N'dbo.ot_actividad', N'U') IS NOT NULL OR OBJECT_ID(N'dbo.ot_firma', N'U') IS NOT NULL
             OR EXISTS (SELECT 1 FROM dbo.subprocess WHERE subprocess_url LIKE N'/process/bitacora-proceso%')
            THROW 50020, N'La reversa de la Bitácora de Proceso no quitó todo.', 1;
          SQL
          x /tmp/ot-verifica-reversa.sql
          x "$M"; x "$M"; x "$M2"; x "$M2"; x "$M3"; x "$M3"; x "$S"; x "$S"
          cat > /tmp/ot-verifica.sql <<'SQL'
          IF (SELECT COUNT(*) FROM dbo.ot_actividad WHERE id_company = 1) <> 14 THROW 50021, N'La siembra de Farmalógica no dejó 14 actividades.', 1;
          IF EXISTS (SELECT 1 FROM dbo.ot_actividad WHERE id_company = 1 AND icono IS NULL) THROW 50024, N'Hay actividades sembradas sin ícono.', 1;
          IF (SELECT COUNT(*) FROM dbo.subprocess WHERE subprocess_url IN (N'/process/bitacora-proceso', N'/process/bitacora-proceso/gestion')) <> 2 THROW 50022, N'Faltan los subprocesos.', 1;
          IF OBJECT_ID(N'dbo.TR_ot_registro_inmutable', N'TR') IS NULL THROW 50023, N'Falta el trigger de inmutabilidad.', 1;
          IF OBJECT_ID(N'dbo.TR_ot_firma_inmutable', N'TR') IS NULL THROW 50025, N'Falta el trigger de inmutabilidad de las firmas.', 1;
          SQL
          x /tmp/ot-verifica.sql

      - name: Correo — reversa (ida y vuelta)
        env:
          DATABASE_URL: ${{ env.SGC_IT_DATABASE_URL }}
        run: |
          set -e
          M=prisma/migrations/20261015120000_correo_modulo/migration.sql
          S=prisma/manual/2026-10-15-correo-permiso.sql
          R=prisma/manual/2026-10-15-correo-reversa.sql
          x() { npx prisma db execute --schema prisma/schema.prisma --file "$1"; }
          # Las pruebas de integración dejaron hilos y auditoría: sin la bandera, la reversa se niega.
          if x "$R"; then echo "La reversa debió negarse sin correo_reversa_acepta_perdida"; exit 1; fi
          { echo "EXEC sp_set_session_context N'correo_reversa_acepta_perdida', 1;"; cat "$R"; } > /tmp/correo-reversa.sql
          x /tmp/correo-reversa.sql; x /tmp/correo-reversa.sql
          cat > /tmp/correo-verifica-reversa.sql <<'SQL'
          IF OBJECT_ID(N'dbo.email_thread_link', N'U') IS NOT NULL OR OBJECT_ID(N'dbo.email_audit', N'U') IS NOT NULL
             OR EXISTS (SELECT 1 FROM dbo.subprocess WHERE subprocess_url = N'/process/correo')
            THROW 50030, N'La reversa del módulo Correo no quitó todo.', 1;
          SQL
          x /tmp/correo-verifica-reversa.sql
          # Sin la migración, el permiso se niega a correr.
          if x "$S"; then echo "El permiso debió negarse sin la migración"; exit 1; fi
          x "$M"; x "$M"; x "$S"; x "$S"
          cat > /tmp/correo-verifica.sql <<'SQL'
          IF (SELECT COUNT(*) FROM dbo.subprocess WHERE subprocess_url = N'/process/correo') <> 1 THROW 50031, N'Falta el subproceso Correo.', 1;
          IF EXISTS (SELECT 1 FROM dbo.subprocess_user_company suc JOIN dbo.subprocess s ON s.id_subprocess = suc.id_subprocess WHERE s.subprocess_url = N'/process/correo') THROW 50032, N'El permiso no debe otorgarse a nadie por defecto.', 1;
          IF OBJECT_ID(N'dbo.TR_email_audit_inmutable', N'TR') IS NULL THROW 50033, N'Falta el trigger de la auditoría.', 1;
          IF OBJECT_ID(N'dbo.CK_email_thread_link_activo', N'C') IS NULL THROW 50034, N'Falta el CHECK del vínculo activo.', 1;
          SQL
          x /tmp/correo-verifica.sql

      - name: Portal TH — formulario propio (migración, siembra y reversa)
        # 20261008160000_portal_formacion_formulario_propio: idempotente sobre
        # el esquema de db push, siembra UNA vez el SST-01-FR-001 (40
        # preguntas), su reversa es idempotente y la migración vuelve a crear
        # todo desde cero.
        env:
          DATABASE_URL: ${{ env.SGC_IT_DATABASE_URL }}
        run: |
          set -e
          M=prisma/migrations/20261008160000_portal_formacion_formulario_propio/migration.sql
          R=prisma/manual/2026-10-08-portal-formulario-propio-reversa.sql
          cat > /tmp/verifica-sst.sql <<'SQL'
          DECLARE @f INT = (SELECT COUNT(*) FROM dbo.portal_formulario WHERE codigo = N'SST-01-FR-001');
          DECLARE @v INT = (SELECT COUNT(*) FROM dbo.portal_formulario_version v JOIN dbo.portal_formulario f ON f.id = v.formulario_id WHERE f.codigo = N'SST-01-FR-001');
          DECLARE @p INT = (SELECT COUNT(*) FROM dbo.portal_formulario_version v JOIN dbo.portal_formulario f ON f.id = v.formulario_id CROSS APPLY OPENJSON(v.definicion, N'$.preguntas') WHERE f.codigo = N'SST-01-FR-001');
          IF @f <> 1 OR @v <> 1 OR @p <> 40 THROW 50000, N'La siembra del SST-01-FR-001 no quedó como se esperaba (1 formulario, 1 versión, 40 preguntas).', 1;
          IF COL_LENGTH(N'dbo.portal_course_material', N'formulario_id') IS NULL THROW 50001, N'Falta portal_course_material.formulario_id.', 1;
          SQL
          cat > /tmp/verifica-reversa.sql <<'SQL'
          IF OBJECT_ID(N'dbo.portal_formulario', N'U') IS NOT NULL OR COL_LENGTH(N'dbo.portal_course_material', N'formulario_id') IS NOT NULL
            THROW 50002, N'La reversa del formulario propio no quitó todo.', 1;
          SQL
          x() { npx prisma db execute --schema prisma/schema.prisma --file "$1"; }
          x "$M"; x "$M"; x /tmp/verifica-sst.sql
          x "$R"; x "$R"; x /tmp/verifica-reversa.sql
          x "$M"; x "$M"; x /tmp/verifica-sst.sql

      - name: Portal TH — evaluaciones (migración y reversa)
        # 20261009150000_portal_formulario_evaluacion: aditiva e idempotente
        # (corre dos veces), su reversa es idempotente y la migración vuelve a
        # crear la tabla de intentos. No toca ninguna tabla existente.
        env:
          DATABASE_URL: ${{ env.SGC_IT_DATABASE_URL }}
        run: |
          set -e
          M=prisma/migrations/20261009150000_portal_formulario_evaluacion/migration.sql
          R=prisma/manual/2026-10-09-portal-formulario-evaluacion-reversa.sql
          cat > /tmp/verifica-intento.sql <<'SQL'
          IF OBJECT_ID(N'dbo.portal_formulario_intento', N'U') IS NULL THROW 50010, N'Falta portal_formulario_intento.', 1;
          IF COL_LENGTH(N'dbo.portal_formulario_intento', N'porcentaje') IS NULL THROW 50011, N'Falta portal_formulario_intento.porcentaje.', 1;
          SQL
          cat > /tmp/verifica-reversa-intento.sql <<'SQL'
          IF OBJECT_ID(N'dbo.portal_formulario_intento', N'U') IS NOT NULL THROW 50012, N'La reversa de evaluaciones no quitó portal_formulario_intento.', 1;
          IF OBJECT_ID(N'dbo.portal_formulario_version', N'U') IS NULL THROW 50013, N'La reversa de evaluaciones no debe tocar portal_formulario_version.', 1;
          SQL
          x() { npx prisma db execute --schema prisma/schema.prisma --file "$1"; }
          x "$M"; x "$M"; x /tmp/verifica-intento.sql
          x "$R"; x "$R"; x /tmp/verifica-reversa-intento.sql
          x "$M"; x /tmp/verifica-intento.sql

      - name: Portal TH — eventos del calendario (migración y reversa)
        # 20261009180000_portal_eventos: aditiva e idempotente (corre dos veces), su reversa es idempotente y la
        # migración vuelve a crear la tabla. No toca ninguna tabla existente.
        env:
          DATABASE_URL: ${{ env.SGC_IT_DATABASE_URL }}
        run: |
          set -e
          M=prisma/migrations/20261009180000_portal_eventos/migration.sql
          R=prisma/manual/2026-10-09-portal-eventos-reversa.sql
          cat > /tmp/verifica-evento.sql <<'SQL'
          IF OBJECT_ID(N'dbo.portal_evento', N'U') IS NULL THROW 50020, N'Falta portal_evento.', 1;
          IF COL_LENGTH(N'dbo.portal_evento', N'eliminado_at') IS NULL THROW 50021, N'Falta portal_evento.eliminado_at.', 1;
          SQL
          cat > /tmp/verifica-reversa-evento.sql <<'SQL'
          IF OBJECT_ID(N'dbo.portal_evento', N'U') IS NOT NULL THROW 50022, N'La reversa de eventos no quitó portal_evento.', 1;
          SQL
          x() { npx prisma db execute --schema prisma/schema.prisma --file "$1"; }
          x "$M"; x "$M"; x /tmp/verifica-evento.sql
          x "$R"; x "$R"; x /tmp/verifica-reversa-evento.sql
          x "$M"; x /tmp/verifica-evento.sql

      - name: Evidencia SGC (manifiesto + matriz de trazabilidad)
        if: always()
        env:
          # En un PR, github.sha es el merge temporal: se sella con el commit real de la rama.
          EVIDENCIA_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/evidencia/sgc-evidencia.mjs

      - name: Archivar evidencia de integración (SGC documental)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-sgc-integracion-${{ github.run_number }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 90

  # ---------------------------------------------------------------------------
  # MCP (mcp/): build (tsc) + pruebas unitarias (vitest)
  # ---------------------------------------------------------------------------
  mcp:
    name: MCP — build y tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Instalar dependencias del front (para el cliente Prisma)
        # mcp/src/db.ts importa ../../app/generated/prisma; hay que generarlo
        # desde la raíz antes de compilar/probar el MCP.
        run: npm ci || npm install

      - name: Generar cliente Prisma (raíz)
        run: npx prisma generate

      - name: Instalar dependencias (mcp)
        run: cd mcp && (npm ci || npm install)

      - name: Build MCP (tsc)
        run: cd mcp && npm run build

      - name: Pruebas unitarias MCP (vitest)
        run: cd mcp && npm test

      - name: Resumen de dependencias MCP (npm audit — informativo)
        # Vuelca el conteo por severidad del árbol del MCP al summary del job.
        # NO bloqueante (solo reporta). El bloqueo real lo hace el paso
        # siguiente.
        if: always()
        continue-on-error: true
        run: |
          cd mcp
          echo "## Auditoría de dependencias (npm audit — mcp)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          npm audit --json > audit-mcp.json 2>/dev/null || true
          node -e '
            const v = require("./audit-mcp.json").metadata.vulnerabilities;
            console.log("| Severidad | Cantidad |");
            console.log("|---|---|");
            for (const k of ["critical","high","moderate","low","info","total"]) {
              console.log(`| ${k} | ${v[k]} |`);
            }
          ' >> "$GITHUB_STEP_SUMMARY" || echo "_No se pudo generar el resumen de npm audit (mcp)._" >> "$GITHUB_STEP_SUMMARY"

      - name: Auditoría de dependencias MCP (npm audit — BLOQUEANTE, critical)
        # Umbral BLOQUEANTE en CRÍTICO (decisión de Nicolás, 2026-08-18): el job
        # falla solo si aparece una vulnerabilidad CRÍTICA en el MCP. Se bajó de
        # ALTA a CRÍTICA porque una advertencia transitiva de severidad alta ajena
        # al código (DeepmergeTS vía @prisma/config) estaba bloqueando todos los
        # PRs. Las de severidad ALTA quedan informativas (revisar y sanear aparte).
        run: cd mcp && npm audit --audit-level=critical
