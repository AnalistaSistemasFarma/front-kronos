name: Deploy a PRUEBAS (.230)

# Auto-deploy del entorno de PRUEBAS Kronos/SynerLink en la .230 (pce0023), SIN
# CAIDA (azul/verde). Se dispara con push/merge a `testing` o a mano.
#
# ESQUEMA (activado una sola vez con scripts\bluegreen\setup-230.ps1):
#   - Dos carpetas de release: A = C:\Users\nicolas.rivera\projects\front-kronos-test
#     y B = ...\front-kronos-test-b (git worktree), cada una con su node_modules
#     y su .next. Los .env / dbconfig.js de B son enlaces simbolicos a los de A.
#   - GSS-Front-TEST-proxy escucha fijo en :3030 (tunel cf-kronos-test e IIS
#     rp-kronos-test no cambian) y reenvia al color activo (A :3032 o B :3033),
#     segun <estado>\active.json.
#   - Job "build": construye la carpeta INACTIVA mientras la activa sigue
#     atendiendo (sin mantenimiento, sin pm2 stop). Se CANCELA si llega un merge
#     mas nuevo: solo se construye el ultimo.
#   - Job "switch": arranca el color nuevo en su puerto, smoke test, cambia el
#     proxy (< 0,5 s, cero peticiones perdidas), mueve kronos-mcp-test (delete +
#     start, ~2-4 s, nunca 2 instancias) y retira el color viejo. NUNCA se cancela
#     a mitad. Si el smoke test falla, no cambia nada (rollback automatico).
#   - La pagina de mantenimiento del IIS queda solo como respaldo si, al final,
#     :3030 no responde.
# Reversa: scripts\bluegreen\revert-230.ps1 + revertir este archivo.

on:
  push:
    branches: [testing]
  workflow_dispatch:
    inputs:
      state_dir:
        description: 'Carpeta de estado azul/verde (vacio = la real de PRUEBAS). Otra carpeta = ensayo aislado que construye la rama elegida.'
        required: false
        default: ''

env:
  BG_STATE_DIR_REAL: C:\Users\nicolas.rivera\projects\front-kronos-test-bluegreen
  IIS_SITE_PATH: C:\inetpub\testrp\rp-kronos-test

jobs:
  build:
    name: Build en la carpeta inactiva (la activa sigue atendiendo)
    runs-on: [self-hosted, kronos-230]
    # Un merge nuevo cancela el build en curso: solo se construye el ultimo.
    concurrency:
      group: deploy-testing-230-build-${{ inputs.state_dir || 'pruebas' }}
      cancel-in-progress: true
    outputs:
      skip: ${{ steps.resolve.outputs.skip }}
      color: ${{ steps.resolve.outputs.color }}
      dir: ${{ steps.resolve.outputs.dir }}
      sha: ${{ steps.resolve.outputs.sha }}
      state_dir: ${{ steps.resolve.outputs.state_dir }}
    steps:
      - name: Resolver color inactivo y commit
        id: resolve
        shell: powershell
        env:
          IN_STATE_DIR: ${{ inputs.state_dir }}
        run: |
          $ErrorActionPreference = "Stop"
          $state = "$env:IN_STATE_DIR".Trim()
          if (-not $state) { $state = $env:BG_STATE_DIR_REAL }
          # En el entorno real siempre se despliega `testing`; un ensayo aislado
          # (otra carpeta de estado) construye la rama desde la que se lanzo.
          $branch = if ($state -eq $env:BG_STATE_DIR_REAL) { 'testing' } else { $env:GITHUB_REF_NAME }
          $cfgFile = Join-Path $state 'bluegreen.json'
          $actFile = Join-Path $state 'active.json'
          if (-not (Test-Path $cfgFile) -or -not (Test-Path $actFile)) {
            throw "No esta activado el azul/verde en $state. Corra scripts\bluegreen\setup-230.ps1 (ver PR). No se toco nada."
          }
          $cfg = Get-Content $cfgFile -Raw | ConvertFrom-Json
          $act = Get-Content $actFile -Raw | ConvertFrom-Json
          $color = if ($act.color -eq 'A') { 'B' } else { 'A' }
          $dir = $cfg.colors.$color.dir
          git -C $dir fetch origin $branch
          if ($LASTEXITCODE -ne 0) { throw "git fetch fallo" }
          $sha = (git -C $dir rev-parse "origin/$branch").Trim()
          $skip = 'false'
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_SHA -ne $sha) {
            $skip = 'true'
            Write-Host "::notice::Run obsoleto ($env:GITHUB_SHA); $branch ya esta en $sha. El run mas nuevo hace el despliegue."
          }
          Write-Host "Activo: $($act.color) (:$($act.port), $($act.sha)). Se construye $color en $dir con $branch@$sha"
          "skip=$skip"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "color=$color"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "dir=$dir"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha=$sha"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "state_dir=$state" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Actualizar codigo de la carpeta inactiva
        if: steps.resolve.outputs.skip != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "${{ steps.resolve.outputs.dir }}"
          $sha = "${{ steps.resolve.outputs.sha }}"
          # Sello fuera ANTES de tocar el codigo: un build cancelado nunca se activa.
          Remove-Item -LiteralPath (Join-Path $dir '.bluegreen-build.json') -Force -ErrorAction SilentlyContinue
          # A esta en la rama testing; B es un worktree en HEAD separado. reset
          # --hard al sha sirve para ambos. Nada corre desde esta carpeta, asi que
          # Windows no bloquea archivos y los borrados del PR si se borran.
          # No hay git clean: los .env (ignorados) y enlaces sobreviven.
          git -C $dir reset --hard $sha
          if ($LASTEXITCODE -ne 0) { throw "git reset fallo" }
          git -C $dir rev-parse HEAD

      - name: Instalar, generar Prisma, migrar y compilar (front + MCP)
        if: steps.resolve.outputs.skip != 'true'
        shell: powershell
        run: |
          $dir = "${{ steps.resolve.outputs.dir }}"
          powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dir 'scripts\bluegreen\build-inactive.ps1') `
            -StateDir "${{ steps.resolve.outputs.state_dir }}" -Color "${{ steps.resolve.outputs.color }}" `
            -Sha "${{ steps.resolve.outputs.sha }}" -RunId "$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw "build-inactive fallo: la version activa sigue atendiendo, sin cambios." }

  switch:
    name: Cambio azul/verde (sin caida)
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: [self-hosted, kronos-230]
    # Nunca se cancela a mitad del cambio; los cambios se hacen de a uno.
    concurrency:
      group: deploy-testing-230-switch-${{ inputs.state_dir || 'pruebas' }}
      cancel-in-progress: false
    steps:
      - name: Arrancar color nuevo, smoke test y cambiar el proxy
        shell: powershell
        run: |
          $dir = "${{ needs.build.outputs.dir }}"
          powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dir 'scripts\bluegreen\switch.ps1') `
            -StateDir "${{ needs.build.outputs.state_dir }}" -Color "${{ needs.build.outputs.color }}" `
            -Sha "${{ needs.build.outputs.sha }}" -RunId "$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -eq 2) { Write-Host "::warning::Front nuevo en linea; el MCP volvio a la version anterior (ver log)." ; exit 0 }
          if ($LASTEXITCODE -ne 0) { throw "switch fallo (codigo $LASTEXITCODE). Ver log: si fallo antes del cambio, la version anterior sigue atendiendo." }

      # Respaldo: solo si al final el puerto publico NO responde 200 se pone la
      # pagina de mantenimiento del IIS (en el entorno real).
      - name: Respaldo - pagina de mantenimiento si :3030 no responde
        if: ${{ always() && needs.build.outputs.state_dir == env.BG_STATE_DIR_REAL }}
        continue-on-error: true
        shell: powershell
        run: |
          $dir = "${{ needs.build.outputs.dir }}"
          $ok = $false
          for ($i = 1; $i -le 6; $i++) {
            try { $r = Invoke-WebRequest -Uri "http://localhost:3030" -UseBasicParsing -TimeoutSec 10; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 5
          }
          if ($ok) {
            Write-Host "OK: :3030 responde 200."
            powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dir 'scripts\maintenance-off.ps1') -SitePath $env:IIS_SITE_PATH -HealthUrl http://localhost:3030/
          } else {
            Write-Host "::error:::3030 no responde 200: se activa la pagina de mantenimiento del IIS."
            Copy-Item (Join-Path $dir 'deploy\iis\_mantenimiento\index.html') (Join-Path $env:IIS_SITE_PATH '_mantenimiento\index.html') -Force
            powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dir 'scripts\maintenance-on.ps1') -SitePath $env:IIS_SITE_PATH -Motivo "deploy $env:GITHUB_SHA sin 200 en :3030"
            exit 1
          }
