name: Deploy to Production (Self-Hosted)

# Auto-deploy de PRODUCCION de SynerLink/Kronos en serfarma05, SIN CAIDA
# (azul/verde). Mismo esquema que PRUEBAS (deploy-testing.yml, PR #860), con las
# diferencias de produccion. Activado una sola vez con
# scripts\bluegreen\setup-serfarma05.ps1 (ver RUNBOOK); reversa con
# scripts\bluegreen\revert-serfarma05.ps1 + revertir este archivo.
#
# ESQUEMA:
#   - Dos carpetas de release, cada una con su node_modules y su .next:
#       A = C:\Users\administrador.DFARUNIADM\projects\front-kronos (la de siempre)
#       B = ...\projects\front-kronos-b (git worktree)
#     Los .env de B son enlaces a los de A; dbconfig.js se copia.
#   - GSS-Front-proxy escucha FIJO en :3003 (IIS/ARR del :8445, agentes que
#     publican directo a 192.168.10.5:3003 y uptime-kuma no cambian) y reenvia
#     al color activo: GSS-Front-A (:3041) o GSS-Front-B (:3042), cluster x2,
#     segun <estado>\active.json.
#   - kronos-mcp (:3020) vive en su carpeta dedicada (...\front-kronos-mcp) y
#     SOLO se toca cuando cambian mcp/, prisma/ o la version de Prisma: hueco de
#     segundos, delete + start, nunca 2 instancias (regla de Nicolas 2026-10-06).
#     Si no cambian, el deploy no lo toca.
#   - PM2 es el del SERVICIO 0pm2.exe (PM2_HOME de administrador). Los scripts
#     comprueban por procesos (sin llamar a pm2) que el daemon vivo sea el del
#     servicio antes de usar pm2; si no, abortan sin tocar nada (incidente
#     2026-10-28: un pm2 sin daemon arranca otro fuera del servicio).
#
# JOB "build" (la version activa sigue atendiendo; sin mantenimiento, sin stop):
#   git reset --hard en la carpeta INACTIVA -> cierra node huerfanos que aun
#   retengan archivos de esa carpeta (doble criterio) -> exige RAM libre ->
#   npm install SOLO si cambiaron package.json/lock -> prisma generate ->
#   next build (prioridad BelowNormal, un reintento) -> build del MCP.
#   Como nada corre desde esa carpeta, ya no hay EPERM de Prisma ni hace falta
#   bajar prod por dependencias nuevas ni por cambio de esquema.
#   ESQUEMA: los SQL de prod siguen siendo MANUALES y PREVIOS al merge. Si el
#   commit cambia prisma/, verificar-esquema.ps1 comprueba en SOLO LECTURA que la
#   BD ya tenga las tablas/columnas nuevas; si faltan, el deploy se detiene antes
#   del cambio (la version activa sigue atendiendo).
#
# JOB "switch" (nunca se cancela a mitad):
#   arranca el color nuevo en su puerto -> smoke test HTTP (/, /login,
#   /api/health/version con el sha nuevo, varias veces para pasar por los 2
#   workers) -> cambia active.json (el proxy cambia en < 0,5 s, sin cortar lo que
#   esta en curso) -> verifica por :3003 -> MCP si hace falta -> drenaje 45 s ->
#   retira el color viejo (su build queda en disco: rollback inmediato con
#   switch.ps1 -Rollback). Si el smoke test falla, NO cambia nada.
#   La pagina de mantenimiento del IIS queda solo como respaldo si al final :3003
#   no responde.
#
# CONCURRENCIA: un solo deploy de prod a la vez y nunca se cancela uno en curso
# (un build de un merge nuevo no puede pisar la carpeta que otro run esta por
# activar). GitHub deja en cola solo el ultimo merge pendiente; un run viejo que
# arranca cuando main ya avanzo se salta solo.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      verificar_esquema:
        description: 'Verificacion de esquema si el commit cambia prisma/: estricto (detiene el deploy si falta algo en la BD) o aviso (solo advierte).'
        type: choice
        options: [estricto, aviso]
        default: estricto

concurrency:
  group: deploy-prod-serfarma05
  cancel-in-progress: false

env:
  # Sin esto, las apps que arranca pm2 heredan RUNNER_TRACKING_ID y el runner las
  # mata al cerrar el job; pm2 las revive tras ~20-35 s sin servicio (medido en
  # PRUEBAS el 2026-11-04). Los scripts ademas quitan GITHUB_*/ACTIONS_*/RUNNER_*
  # del entorno al llamar a pm2.
  RUNNER_TRACKING_ID: ''
  BG_STATE_DIR: C:\Users\administrador.DFARUNIADM\projects\front-kronos-bluegreen
  PM2_HOME: C:\Users\administrador.DFARUNIADM\.pm2
  IIS_SITE_PATH: C:\inetpub\wwwroot\GSS

jobs:
  build:
    name: Build en la carpeta inactiva (la activa sigue atendiendo)
    # RUNNER FIJO: el repo tiene dos runners self-hosted Windows (prod y la .230).
    runs-on: [self-hosted, serfarma05]
    timeout-minutes: 75
    outputs:
      skip: ${{ steps.resolve.outputs.skip }}
      color: ${{ steps.resolve.outputs.color }}
      dir: ${{ steps.resolve.outputs.dir }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolver color inactivo y commit
        id: resolve
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $state = $env:BG_STATE_DIR
          $cfgFile = Join-Path $state 'bluegreen.json'
          $actFile = Join-Path $state 'active.json'
          if (-not (Test-Path $cfgFile) -or -not (Test-Path $actFile)) {
            throw "El azul/verde de produccion NO esta activado ($state). Corra scripts\bluegreen\setup-serfarma05.ps1 segun el RUNBOOK. No se toco nada: prod sigue con la version anterior."
          }
          $cfg = Get-Content $cfgFile -Raw | ConvertFrom-Json
          $act = Get-Content $actFile -Raw | ConvertFrom-Json
          $color = if ($act.color -eq 'A') { 'B' } else { 'A' }
          $dir = $cfg.colors.$color.dir
          git -C $dir fetch origin main
          if ($LASTEXITCODE -ne 0) { throw "git fetch fallo en $dir" }
          $sha = (git -C $dir rev-parse origin/main).Trim()
          $skip = 'false'
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_SHA -ne $sha) {
            $skip = 'true'
            Write-Host "::notice::Run obsoleto ($env:GITHUB_SHA); main ya esta en $sha. El run mas nuevo hace el despliegue."
          }
          if ($act.sha -eq $sha) {
            $skip = 'true'
            Write-Host "::notice::$sha ya es la version activa ($($act.color)). Nada que desplegar."
          }
          Write-Host "Activo: $($act.color) (:$($act.port), $($act.sha)). Se construye $color en $dir con main@$sha"
          "skip=$skip"            | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "color=$color"          | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "dir=$dir"              | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha=$sha"              | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "active_sha=$($act.sha)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Actualizar codigo de la carpeta inactiva y detectar cambios
        id: changes
        if: steps.resolve.outputs.skip != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "${{ steps.resolve.outputs.dir }}"
          $sha = "${{ steps.resolve.outputs.sha }}"
          $old = "${{ steps.resolve.outputs.active_sha }}"
          # Sello fuera ANTES de tocar el codigo: un build a medias nunca se activa.
          Remove-Item -LiteralPath (Join-Path $dir '.bluegreen-build.json') -Force -ErrorAction SilentlyContinue
          # reset --hard solo toca archivos versionados: .env, dbconfig.js y los
          # enlaces (ignorados) sobreviven. Sin git clean.
          git -C $dir reset --hard $sha
          if ($LASTEXITCODE -ne 0) { throw "git reset fallo" }
          function Changed([string[]]$paths) {
            git -C $dir diff --quiet $old $sha -- @paths 2>$null
            if ($LASTEXITCODE -eq 0) { return '0' } else { return '1' }
          }
          $schema = Changed @('prisma')
          $mcp = Changed @('mcp')
          $deps = Changed @('package.json', 'package-lock.json', 'mcp/package.json', 'mcp/package-lock.json')
          Write-Host "Cambios $old..$sha -> esquema=$schema mcp=$mcp dependencias=$deps"
          "schema=$schema" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "| Cambio | Valor |`n|---|---|`n| prisma/ | $schema |`n| mcp/ | $mcp |`n| dependencias | $deps |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Instalar, generar Prisma y compilar (front + MCP) en la carpeta inactiva
        if: steps.resolve.outputs.skip != 'true'
        shell: powershell
        run: |
          $dir = "${{ steps.resolve.outputs.dir }}"
          powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dir 'scripts\bluegreen\build-inactive.ps1') `
            -StateDir "$env:BG_STATE_DIR" -Color "${{ steps.resolve.outputs.color }}" `
            -Sha "${{ steps.resolve.outputs.sha }}" -RunId "$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw "build-inactive fallo: la version activa sigue atendiendo, sin cambios." }

      - name: (Solo si cambia prisma/) verificar que la BD ya tiene el esquema nuevo
        if: steps.resolve.outputs.skip != 'true' && steps.changes.outputs.schema == '1'
        shell: powershell
        env:
          MODO: ${{ inputs.verificar_esquema || 'estricto' }}
        run: |
          $dir = "${{ steps.resolve.outputs.dir }}"
          powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dir 'scripts\bluegreen\verificar-esquema.ps1') `
            -Dir $dir -OldSha "${{ steps.resolve.outputs.active_sha }}" -NewSha "${{ steps.resolve.outputs.sha }}"
          $rc = $LASTEXITCODE
          if ($rc -ne 0) {
            if ($env:MODO -eq 'aviso') { Write-Host "::warning::Verificacion de esquema con codigo $rc (modo aviso: se sigue)."; exit 0 }
            throw "Verificacion de esquema con codigo $rc. No se cambia de version: la activa sigue atendiendo. Aplique los SQL del pase y relance (workflow_dispatch)."
          }

      - name: Verificar que la BD tiene las tablas y columnas que el codigo usa sin Prisma (siempre)
        if: steps.resolve.outputs.skip != 'true'
        shell: powershell
        env:
          MODO: ${{ inputs.verificar_esquema || 'estricto' }}
        run: |
          # prisma/manual/objetos-requeridos.json: task_kind, task_sap_action, sales_*... (bloque B, 2026-11-05).
          # Solo lectura (OBJECT_ID / COL_LENGTH). Si falta algo, no hay cambio de color.
          $dir = "${{ steps.resolve.outputs.dir }}"
          node (Join-Path $dir 'scripts\bluegreen\verificar-objetos-sql.cjs') $dir
          $rc = $LASTEXITCODE
          if ($rc -ne 0) {
            if ($env:MODO -eq 'aviso') { Write-Host "::warning::Verificacion de objetos SQL con codigo $rc (modo aviso: se sigue)."; exit 0 }
            throw "Faltan tablas o columnas en la BD (codigo $rc). No se cambia de version: la activa sigue atendiendo. Aplique los SQL del pase y relance (workflow_dispatch)."
          }

  switch:
    name: Cambio azul/verde (sin caida)
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: [self-hosted, serfarma05]
    timeout-minutes: 30
    steps:
      - name: Arrancar color nuevo, smoke test, cambiar el proxy y retirar el viejo
        shell: powershell
        run: |
          $dir = "${{ needs.build.outputs.dir }}"
          powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dir 'scripts\bluegreen\switch.ps1') `
            -StateDir "$env:BG_STATE_DIR" -Color "${{ needs.build.outputs.color }}" `
            -Sha "${{ needs.build.outputs.sha }}" -RunId "$env:GITHUB_RUN_ID"
          $rc = $LASTEXITCODE
          if ($rc -eq 2) { Write-Host "::warning::Front nuevo en linea; el MCP quedo en su version anterior (ver log)."; exit 0 }
          if ($rc -ne 0) { throw "switch fallo (codigo $rc). Si fallo antes del cambio, la version anterior sigue atendiendo." }

      # Respaldo: solo si al final :3003 NO responde 200 se pone la pagina de
      # mantenimiento del IIS. Si responde y quedo una bandera vieja, se quita.
      - name: Respaldo - pagina de mantenimiento solo si :3003 no responde
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          $dir = "${{ needs.build.outputs.dir }}"
          $ok = $false
          for ($i = 1; $i -le 6; $i++) {
            try { $r = Invoke-WebRequest -Uri "http://localhost:3003/" -UseBasicParsing -TimeoutSec 10; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 5
          }
          if ($ok) {
            Write-Host "OK: :3003 responde 200."
            powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dir 'scripts\maintenance-off.ps1') -SitePath $env:IIS_SITE_PATH -HealthUrl http://localhost:3003/
          } else {
            Write-Host "::error:::3003 no responde 200: se activa la pagina de mantenimiento del IIS."
            Copy-Item (Join-Path $dir 'deploy\iis\_mantenimiento\index.html') (Join-Path $env:IIS_SITE_PATH '_mantenimiento\index.html') -Force
            powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dir 'scripts\maintenance-on.ps1') -SitePath $env:IIS_SITE_PATH -Motivo "deploy $env:GITHUB_SHA sin 200 en :3003"
            exit 1
          }

      - name: Resumen
        if: always()
        shell: powershell
        run: |
          $a = Get-Content (Join-Path $env:BG_STATE_DIR 'active.json') -Raw -ErrorAction SilentlyContinue
          $v = try { (Invoke-WebRequest -UseBasicParsing -Uri http://localhost:3003/api/health/version -TimeoutSec 10).Content } catch { "sin respuesta" }
          $m = try { (Invoke-WebRequest -UseBasicParsing -Uri http://localhost:3020/health -TimeoutSec 10).StatusCode } catch { "sin respuesta" }
          "### Produccion`n- active.json: ``$($a -replace '\s+',' ')```n- /api/health/version: ``$v```n- kronos-mcp /health: $m" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
