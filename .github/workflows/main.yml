name: Deploy to Production (Self-Hosted)

on:
  push:
    branches:
      - main

# Auto-deploy de PRODUCCIÓN (serfarma05, app pm2 GSS-Front en :3003).
#
# RUNNER FIJO: se ancla con la etiqueta `serfarma05` (además de self-hosted)
# porque el repo tiene DOS runners self-hosted Windows (prod y la .230). Con solo
# `self-hosted` el job podía caer en la máquina equivocada y fallar en el `cd`.
#
# CÓDIGO: `git fetch` + `git reset --hard origin/main` (NO `git pull`). `pull` se
# aborta si el árbol de prod tiene cambios locales en archivos versionados (eso
# tumbó el deploy del 2026-06-30). `reset --hard` solo toca archivos VERSIONADOS;
# los git-ignored (dbconfig.js, app/generated/prisma, .env) sobreviven porque NO
# ejecutamos `git clean`.
#
# PRISMA (2026-08-12): el deploy AHORA detecta si cambio `prisma/schema.prisma` o
# `prisma/migrations` entre el HEAD viejo y origin/main:
#   - Si NO cambio el esquema -> camino normal CERO DOWNTIME: npm install -> build ->
#     `pm2 reload` (grácil, sin detener). El cliente Prisma en disco sigue vigente.
#   - Si SI cambio el esquema -> detiene GSS-Front + kronos-mcp (para liberar el DLL
#     query_engine-windows.dll.node, que si no da EPERM), corre `npx prisma generate`,
#     compila y `pm2 start`. Esto implica una caida BREVE, pero evita el paso manual
#     que antes hacia falta (prod servia codigo nuevo con cliente Prisma viejo -> 500
#     en modelos nuevos y en el callback jwt de next-auth). Ver ventana del 2026-08-12.
#   `migrate deploy` sigue SIN correrse (la BD de prod no esta baselined, da P3005);
#   los cambios de tablas/columnas se aplican A MANO en la BD antes del pase.
#
# CERO DOWNTIME: el camino normal usa `pm2 reload` (recarga grácil instancia por
# instancia). Si el build falla, NO se recarga: GSS-Front sigue sirviendo el build
# anterior. Solo el camino de cambio-de-esquema hace stop/start (caida breve).

concurrency:
  group: deploy-prod-serfarma05
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, serfarma05]
    env:
      PROJECT_DIR: C:\Users\administrador.DFARUNIADM\projects\front-kronos

    steps:
      - name: Actualizar codigo y detectar cambio de esquema
        shell: cmd
        run: |
          cd /d %PROJECT_DIR% || exit /b 1
          for /f %%i in ('git rev-parse HEAD') do set "OLD_HEAD=%%i"
          echo === git fetch origin ===
          git fetch origin || exit /b 1
          echo === git reset --hard origin/main ===
          git reset --hard origin/main || exit /b 1
          git rev-parse --short HEAD
          echo === detectar cambio en prisma/schema.prisma o migraciones ===
          git diff --quiet %OLD_HEAD% HEAD -- prisma/schema.prisma prisma/migrations
          if errorlevel 1 (set "SCHEMA_CHANGED=1") else (set "SCHEMA_CHANGED=0")
          echo SCHEMA_CHANGED=%SCHEMA_CHANGED%
          rem OJO: la redireccion va DELANTE del echo a proposito. Escrito como
          rem `echo SCHEMA_CHANGED=%%SCHEMA_CHANGED%%>>%%GITHUB_ENV%%`, cmd.exe lee el
          rem digito pegado al `>>` como el NUMERO DEL FLUJO (1=salida, 0=entrada),
          rem no como parte del valor: al archivo llegaba `SCHEMA_CHANGED=` vacio y el
          rem paso condicional de abajo NUNCA se ejecutaba. Con la redireccion primero
          rem no hay digito adyacente al operador y el valor viaja completo.
          >>"%GITHUB_ENV%" echo SCHEMA_CHANGED=%SCHEMA_CHANGED%
          echo === detectar cambio bajo mcp/ ===
          git diff --quiet %OLD_HEAD% HEAD -- mcp
          if errorlevel 1 (set "MCP_CHANGED=1") else (set "MCP_CHANGED=0")
          echo MCP_CHANGED=%MCP_CHANGED%
          rem Misma regla de arriba: la redireccion va DELANTE del echo.
          >>"%GITHUB_ENV%" echo MCP_CHANGED=%MCP_CHANGED%

      - name: Instalar dependencias
        shell: cmd
        run: |
          cd /d %PROJECT_DIR% || exit /b 1
          echo === npm install ===
          call npm install || exit /b 1

      - name: (Solo si cambio el esquema) detener apps y regenerar cliente Prisma
        if: env.SCHEMA_CHANGED == '1'
        shell: cmd
        run: |
          cd /d %PROJECT_DIR% || exit /b 1
          echo === cambio de esquema: detengo apps para liberar el DLL de Prisma ===
          call pm2 stop GSS-Front
          call pm2 stop kronos-mcp
          rem `pm2 stop` devuelve el control ANTES de que Windows libere las
          rem bibliotecas que los procesos tenian abiertas. El pase del
          rem 2026-09-08 se cayo aqui: `prisma generate` corrio medio segundo
          rem despues del stop y murio con EPERM al renombrar
          rem query_engine-windows.dll.node. Como este paso fallo, "Compilar" y
          rem "Levantar" se saltaron y el servicio quedo ABAJO sin nada nuevo
          rem puesto. Ver scripts/esperar-motor-prisma.cjs.
          echo === espero a que el motor de Prisma quede libre ===
          call node scripts\esperar-motor-prisma.cjs 20 500
          echo === prisma generate ===
          call npx prisma generate && goto :generado
          echo    fallo el primer intento; espero un poco mas y reintento
          call node scripts\esperar-motor-prisma.cjs 20 1000
          call npx prisma generate || exit /b 1
          :generado

      - name: Compilar
        shell: cmd
        run: |
          cd /d %PROJECT_DIR% || exit /b 1
          echo === next build ===
          call npm run build || exit /b 1

      - name: Levantar o recargar GSS-Front
        shell: cmd
        run: |
          cd /d %PROJECT_DIR% || exit /b 1
          if "%SCHEMA_CHANGED%"=="1" (
            echo === cambio de esquema: levanto apps ===
            call pm2 start GSS-Front || call pm2 restart GSS-Front || exit /b 1
            call pm2 start kronos-mcp || call pm2 restart kronos-mcp || exit /b 1
          ) else (
            echo === deploy normal: reload cero downtime ===
            call pm2 reload GSS-Front || exit /b 1
          )
          call pm2 save

      # MCP de Kronos (kronos-mcp, :3020). Antes el deploy NUNCA compilaba mcp/:
      # serve.mjs arranca desde mcp/dist (gitignored), asi que un cambio en
      # mcp/src llegaba al disco pero el proceso seguia sirviendo el dist viejo
      # hasta que alguien compilaba a mano. Aqui, si el push trae cambios bajo
      # mcp/, se instala, se compila y se reinicia SOLO kronos-mcp (1 instancia;
      # nunca all/kill). Va despues de "Levantar" para cubrir tambien el camino
      # de cambio de esquema (que ya hizo pm2 start kronos-mcp con el dist viejo).
      #
      # PM2: el runner corre como DFARUNIADM\nicolas.rivera, pero el daemon real
      # de produccion vive en el PM2_HOME de administrador (servicio 0pm2.exe,
      # ver incidente 2026-10-06). Se fijan PM2_HOME y la ruta completa de
      # pm2.cmd para no depender del PATH ni de que el servicio del runner haya
      # heredado la variable de maquina. Sin --update-env: no se inyecta el
      # entorno del runner al proceso del MCP (este lee su propio mcp\.env).
      - name: (Solo si cambio mcp/) compilar y reiniciar kronos-mcp
        if: env.MCP_CHANGED == '1'
        shell: cmd
        env:
          PM2_HOME: C:\Users\administrador.DFARUNIADM\.pm2
          PM2_CMD: C:\Users\administrador.DFARUNIADM\AppData\Roaming\npm\pm2.cmd
        run: |
          cd /d %PROJECT_DIR%\mcp || exit /b 1
          echo === npm ci (mcp) ===
          call npm ci --no-audit --no-fund || exit /b 1
          echo === npm run build (mcp) ===
          call npm run build || exit /b 1
          echo === pm2 restart kronos-mcp ===
          call "%PM2_CMD%" restart kronos-mcp || exit /b 1
          rem `pm2 list` (no `describe`/`jlist`, que imprimen variables de entorno).
          call "%PM2_CMD%" list

      - name: (Solo si cambio mcp/) verificar que kronos-mcp responde
        if: env.MCP_CHANGED == '1'
        shell: powershell
        run: |
          $ok = $false
          for ($i = 1; $i -le 12; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 -Uri "http://127.0.0.1:3020/health"
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 5
          }
          if (-not $ok) { throw "kronos-mcp no respondio /health en :3020 tras el reinicio" }
          Write-Host "kronos-mcp OK en :3020/health"
